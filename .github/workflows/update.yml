name: Update EPG

on:
  schedule:
    # 每天 06:30（北京时间）= 22:30 UTC 前一天
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "epg/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 生成节目单
        run: python -m epg build --days 2 --no-archive

      - name: 写入当日历史快照
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          mkdir -p "data/archive/$DAY"
          cp dist/epg.json "data/archive/$DAY/epg.json"

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist data/archive
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(epg): 自动更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push

      # Pages 未启用时自动跳过发布，避免每次运行都报红。
      # 想开网页版：仓库 Settings → Pages → Source 选 "GitHub Actions"。
      - name: 检查 Pages 是否启用
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if curl -sf -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/pages" > /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages 尚未启用，本次跳过发布。开启方法：Settings → Pages → Source 选择 GitHub Actions。"
          fi

      - name: 打包网页版
        if: github.ref == 'refs/heads/main' && steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp -r dist/. _site/data/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && steps.pages.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
