name: Update EPG

on:
  schedule:
    # 每天 06:30（北京时间）= 22:30 UTC 前一天
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "epg/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 生成节目单
        run: python -m epg build --days 2 --no-archive

      - name: 写入当日历史快照
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          mkdir -p "data/archive/$DAY"
          cp dist/epg.json "data/archive/$DAY/epg.json"

      - name: 清理过期历史快照
        run: |
          # 只保留最近 30 天，避免仓库每天 +1MB 无限膨胀
          find data/archive -mindepth 1 -maxdepth 1 -type d | sort | head -n -30 | xargs -r rm -rf

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist data/archive
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(epg): 自动更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push

      # 把节目单发布到 Gitee 发行版附件，供国内网络直接访问。
      # 为什么不用 Gitee 的 raw：raw 对超过约 64KB 的文件会返回 451（内容审核），
      # 发行版附件走另一套存储，1MB 文件实测正常。
      # 需要在仓库 Secrets 里配置 GITEE_USER 和 GITEE_TOKEN；没配就自动跳过。
      - name: 发布数据到 Gitee 发行版
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set +e
          python scripts/publish_gitee.py dist/epg.xml dist/epg.json > /tmp/gitee.log 2>&1
          CODE=$?
          {
            echo "exit_code=$CODE"
            echo "time=$(date -u +%FT%TZ)"
            echo "user_present=$([ -n "$GITEE_USER" ] && echo yes || echo no)"
            echo "token_present=$([ -n "$GITEE_TOKEN" ] && echo yes || echo no)"
            echo "--- output ---"
            tail -n 25 /tmp/gitee.log
          } > data/gitee-status.txt
          git add data/gitee-status.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: 记录 Gitee 发布状态" || true
          git push -q || true
          cat data/gitee-status.txt
          exit $CODE

      # 同时把整个仓库镜像过去，方便国内直接浏览源码 / clone
      - name: 镜像代码到 Gitee
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_USER" ]; then
            echo "::notice::未配置 GITEE_USER / GITEE_TOKEN，跳过代码镜像"
            exit 0
          fi
          REMOTE="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/cn-tv-epg.git"
          git remote add gitee "$REMOTE" 2>/dev/null || git remote set-url gitee "$REMOTE"
          git push gitee HEAD:master --force
          echo "::notice::已同步到 https://gitee.com/${GITEE_USER}/cn-tv-epg"

      # Pages 未启用时自动跳过发布，避免每次运行都报红。
      # 想开网页版：仓库 Settings → Pages → Source 选 "GitHub Actions"。
      - name: 检查 Pages 是否启用
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if curl -sf -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/pages" > /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages 尚未启用，本次跳过发布。开启方法：Settings → Pages → Source 选择 GitHub Actions。"
          fi

      - name: 打包网页版
        if: github.ref == 'refs/heads/main' && steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp -r dist/. _site/data/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && steps.pages.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
