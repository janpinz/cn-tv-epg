name: Update EPG

on:
  schedule:
    # 每天 06:30（北京时间）= 22:30 UTC 前一天
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "epg/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 生成节目单
        run: python -m epg build --days 2 --no-archive

      - name: 写入当日历史快照
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          mkdir -p "data/archive/$DAY"
          cp dist/epg.json "data/archive/$DAY/epg.json"

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist data/archive
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(epg): 自动更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push

      - name: 打包网页版
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp -r dist/. _site/data/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
