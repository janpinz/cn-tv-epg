# =====================================================================
# 频道注册表 —— 这是本项目唯一需要手工维护的「频道清单」
#
# 字段说明
#   id      频道唯一标识（用于文件、接口、播放器匹配，一旦发布请勿修改）
#   name    显示名称（节目单里看到的名字）
#   source  数据源 id，对应 config/settings.toml 里 [[sources]] 的 id
#   ref     频道在该数据源中的原始名称/编号
#
# 新增频道：复制一行，改 id / name / ref 即可。
# 不确定 ref 怎么写？先跑：
#   python -m epg discover --source tvmao --province 320000
# 或
#   python -m epg resolve --source xmltv-51zmt --name 湖南卫视
# =====================================================================

